<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task Reminder App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>

<div class="page-header">

    <div class="header-title-left">
        ⏰ Task Reminder App
    </div>

    <div class="header-icons-center">
        <a th:href="@{/dashboard}" title="Dashboard Statistics">
            <i class="fa-solid fa-chart-line"></i>
        </a>
        <a th:href="@{/api/cal}" title="Calendar View">
            <i class="fa-solid fa-calendar"></i>
        </a>
        <a th:href="@{/api/grid}" title="Grid View">
            <i class="fa-solid fa-table-cells"></i>
        </a>
    </div>

    <div class="header-icons-right">
        <span id="clock" class="header-clock"></span>
        <span th:text="${loggedUser != null} ? 'Welcome! ' + ${loggedUser.name} : 'Guest'"></span>

        <!-- DARK MODE TOGGLE -->
        <i id="themeIcon" class="fa-solid fa-moon theme-toggle" title="Toggle Dark Mode"></i>

        <a th:href="@{/profile}" class="profile-link" title="Profile">
            <img th:if="${loggedUser != null && loggedUser.profileImageBase64 != null}"
                 th:src="'data:image/*;base64,' + ${loggedUser.profileImageBase64}"
                 class="profile-pic" alt="Profile"/>
            <img th:if="${loggedUser == null || loggedUser.profileImageBase64 == null}"
                 src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                 class="profile-pic" alt="Default Profile"/>
        </a>

        <a th:href="@{/logout}" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
    </div>
</div>

<!-- FILTER CARD -->
<div class="filter-card mx-2">
    <form th:action="@{/api/tasks}" method="get" class="d-flex flex-wrap gap-2 align-items-end w-100">

        <div>
            <label>Status</label>
            <select name="status" class="form-select">
                <option value="">All</option>
                <option value="PENDING" th:selected="${param.status=='PENDING'}">Pending</option>
                <option value="IN_PROGRESS" th:selected="${param.status=='IN_PROGRESS'}">In Progress</option>
                <option value="COMPLETED" th:selected="${param.status=='COMPLETED'}">Completed</option>
            </select>
        </div>

        <div>
            <label>Priority</label>
            <select name="priority" class="form-select">
                <option value="">All</option>
                <option value="LOW" th:selected="${param.priority=='LOW'}">Low</option>
                <option value="MEDIUM" th:selected="${param.priority=='MEDIUM'}">Medium</option>
                <option value="HIGH" th:selected="${param.priority=='HIGH'}">High</option>
            </select>
        </div>

        <div>
            <label>Sort By</label>
            <select name="sortBy" class="form-select">
                <option value="id">ID</option>
                <option value="dueDate">Due Date</option>
                <option value="priority">Priority</option>
                <option value="title">Title</option>
                <option value="createdAt">Created At</option>
                <option value="completedAt">Completed At</option>
            </select>
        </div>

        <div>
            <label>Keyword</label>
            <input type="text" name="keyword" class="form-control" placeholder="Search...">
        </div>

        <div class="action-group">
            <button class="btn btn-primary">Apply</button>
            <a th:href="@{/api/tasks(pageNo=0,pageSize=5,sortBy=id)}" class="btn btn-outline-secondary">Clear</a>
            <a th:href="@{/api/}" class="btn btn-outline-secondary">Add Task</a>
            <button type="button" class="btn btn-success" onclick="exportCsv()">
                <i class="fa-solid fa-file-csv"></i> Export
            </button>
        </div>
    </form>
</div>

<!-- TABLE -->
<div class="table-container mx-2">
    <table class="table table-striped table-hover table-bordered">
        <thead>
        <tr>
            <th>ID</th><th>Title</th><th>Description</th><th>Due Date</th>
            <th>Priority</th><th>Status</th><th>Created At</th>
            <th>Completed At</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.id}"></td>
            <td th:text="${task.title}"></td>
            <td th:text="${task.description}"></td>
            <td th:text="${task.dueDate}"></td>
            <td th:text="${task.priority}"></td>
            <td th:text="${task.status}"></td>
            <td th:text="${task.createdAt}"></td>
            <td th:text="${task.completedAt}"></td>
            <td>
                <div class="d-flex justify-content-center gap-1">
                    <a th:href="@{/api/view/{id}(id=${task.id})}" class="btn btn-sm btn-primary">View</a>
                    <a th:href="@{/api/form/{id}(id=${task.id})}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="javascript:void(0);" class="btn btn-sm btn-danger"
                       th:onclick="|confirmDelete('/api/task/${task.id}')|">Delete</a>
                    <a th:href="@{/api/taskUpdate/{id}(id=${task.id})}" class="btn btn-sm btn-success">Done</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- FOOTER -->
<footer>
    Task Reminder App © 2025 — Created by Bishwanath Kumam
</footer>

<!-- EXPORT MODAL -->
<div id="exportModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fa-solid fa-file-csv"></i> Export Tasks</h5>
                <button type="button" class="btn-close" onclick="closeExportModal()"></button>
            </div>
            <div class="modal-body text-center">
                <p>How do you want to export the tasks?</p>
            </div>
            <div class="modal-footer justify-content-center">
                <button class="btn btn-success" onclick="downloadCsv()">
                    <i class="fa-solid fa-download"></i> Download
                </button>
                <button class="btn btn-primary" onclick="sendCsvMail()">
                    <i class="fa-solid fa-envelope"></i> Mail
                </button>
            </div>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
    <div id="appToast" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg">
                Action completed successfully
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // CLOCK
    function updateClock() {
        document.getElementById("clock").innerText =
            "🕒 " + new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // EXPORT FUNCTIONS
    function exportCsv() { const modal = new bootstrap.Modal(document.getElementById('exportModal')); modal.show(); }
    function closeExportModal() { bootstrap.Modal.getInstance(document.getElementById('exportModal')).hide(); }
    function downloadCsv() { window.location.href = "/api/csv/download"; closeExportModal(); showToast("CSV downloaded successfully 📥"); }
    function sendCsvMail() { window.location.href = "/api/email/csv-send"; closeExportModal(); showToast("CSV sent to your email ✉️"); }

    function showToast(message, type = "success") {
        const toastEl = document.getElementById("appToast");
        const toastMsg = document.getElementById("toastMsg");
        toastMsg.innerText = message;
        toastEl.className = `toast align-items-center text-bg-${type} border-0`;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
    }

    // DARK MODE
    const themeIcon = document.getElementById("themeIcon");
    function applyTheme(theme) {
        document.body.classList.toggle("dark-mode", theme === "dark");
        themeIcon.className = theme === "dark" ? "fa-solid fa-sun theme-toggle" : "fa-solid fa-moon theme-toggle";
    }
    const savedTheme = localStorage.getItem("theme") || "light";
    applyTheme(savedTheme);
    themeIcon.onclick = () => {
        const newTheme = document.body.classList.contains("dark-mode") ? "light" : "dark";
        localStorage.setItem("theme", newTheme);
        applyTheme(newTheme);
    };
</script>

</body>
</html>
