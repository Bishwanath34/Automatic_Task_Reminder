<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

</head>

<body>

<!-- ================= HEADER ================= -->
<div class="page-header">
    <div class="header-left">
        <a th:href="@{/api/tasks}" class="back-btn" title="Back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        ⏰ Task Reminder App
    </div>

    <div class="header-right">

        <span id="clock" class="header-clock"></span>

        <span th:text="${loggedUser != null} ? 'Welcome! ' + ${loggedUser.name} : 'Guest'"></span>


        <a th:href="@{/profile}" class="profile-link" title="Profile">


            <img th:if="${loggedUser != null && loggedUser.profileImageBase64 != null}"
                 th:src="'data:image/*;base64,' + ${loggedUser.profileImageBase64}"
                 class="profile-pic"
                 alt="Profile"/>


            <img th:if="${loggedUser == null || loggedUser.profileImageBase64 == null}"
                 src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                 class="profile-pic"
                 alt="Default Profile"/>

        </a>

        <a th:href="@{/logout}" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>

    </div>

</div>

<!-- ================= CONTENT ================= -->
<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="profile-box">
            <a th:href="@{/profile}" class="profile-link">
                <img th:if="${loggedUser != null && loggedUser.profileImageBase64 != null}"
                     th:src="'data:image/*;base64,' + ${loggedUser.profileImageBase64}"
                     class="profile-pic"
                     alt="Profile"/>

                <img th:if="${loggedUser == null || loggedUser.profileImageBase64 == null}"
                     src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                     class="profile-pic"
                     alt="Default Profile"/>
            </a>
            <div th:text="${loggedUser != null ? loggedUser.name : 'Guest'}"></div>
        </div>


        <a th:href="@{/profile}">
            <i class="fa-solid fa-user"></i> Profile
        </a>

        <a th:href="@{/api/}">
            <i class="fa-solid fa-plus"></i> Add Task
        </a>

        <a th:href="@{/api/cal}">
            <i class="fa-solid fa-calendar"></i> Calendar
        </a>

        <a th:href="@{/api/grid}">
            <i class="fa-solid fa-table-cells"></i> Grid View
        </a>

        <!-- Sidebar logout link (regular style, not logout-btn class) -->
        <a th:href="@{/logout}" style="margin-top: auto;">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <h2>Tasks Dashboard</h2>

        <!-- CARDS -->
        <section class="cards">
            <div class="card">
                <h4>Pending</h4>
                <div class="value" th:text="${pendingCount}">0</div>
            </div>

            <div class="card">
                <h4>Overdue</h4>
                <div class="value" th:text="${overdueCount}">0</div>
            </div>

            <div class="card">
                <h4>Completed</h4>
                <div class="value" th:text="${completedCount}">0</div>
            </div>
        </section>

        <!-- CHARTS -->
        <section class="charts">
            <div class="card">
                <h4>Status Overview</h4>
                <canvas id="statusChart"></canvas>
            </div>

            <div class="card">
                <h4>Total Tasks</h4>
                <canvas id="totalChart"></canvas>
            </div>
        </section>

        <div style="height: 300px;"></div>
    </main>
</div>

<!-- ================= FOOTER ================= -->
<footer>
    Task Reminder App © 2025 — Created by Bishwanath Kumam
</footer>

<!-- ================= SCRIPTS ================= -->
<script th:inline="javascript">
    const pending = [[${pendingCount}]];
    const overdue = [[${overdueCount}]];
    const completed = [[${completedCount}]];
    const total = [[${totalCount}]];

    new Chart(document.getElementById('statusChart'), {
        type: 'bar',
        data: {
            labels: ['Pending', 'Overdue', 'Completed'],
            datasets: [{
                label: 'Tasks',
                data: [pending, overdue, completed],
                backgroundColor: ['#36a2eb', '#ff6384', '#4bc0c0']
            }]
        },
        options: {
            plugins: { legend: { display: false } }
        }
    });

    new Chart(document.getElementById('totalChart'), {
        type: 'doughnut',
        data: {
            labels: ['Total Tasks'],
            datasets: [{
                data: [total],
                backgroundColor: ['#9966ff']
            }]
        },
        options: {
            plugins: { legend: { display: false } }
        }
    });

    // ====== CLOCK / TIMER ======
    function updateClock() {
        const now = new Date();
        const time = now.toLocaleTimeString();
        document.getElementById("clock").innerText = "🕒 " + time;
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>

</body>
</html>
