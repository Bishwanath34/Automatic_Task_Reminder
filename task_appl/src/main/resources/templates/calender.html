<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Reminder Calendar</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/cal.css}">
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="page-header">
    <div class="header-left">
        <a th:href="@{/api/tasks}" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        ⏰ Task Reminder App
    </div>

    <div class="header-right">
        <span id="clock" class="header-clock"></span>
        <span th:text="${loggedUser != null} ? 'Welcome! ' + ${loggedUser.name} : 'Guest'"></span>

        <!-- DARK MODE -->
        <i id="themeIcon" class="fa-solid fa-moon theme-toggle"></i>

        <!-- PROFILE -->
        <a th:href="@{/profile}" class="profile-link">
            <img th:if="${loggedUser != null && loggedUser.profileImageBase64 != null}"
                 th:src="'data:image/*;base64,' + ${loggedUser.profileImageBase64}"
                 class="profile-pic">
            <img th:if="${loggedUser == null || loggedUser.profileImageBase64 == null}"
                 src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                 class="profile-pic">
        </a>

        <a th:href="@{/logout}" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
    </div>
</div>

<!-- ================= CALENDAR ================= -->
<div class="calendar-wrapper">
    <div class="calendar">
        <div class="calendar-header">
            <button id="prev">❮</button>
            <h2 id="monthYear"></h2>
            <button id="next">❯</button>
        </div>

        <div class="calendar-days">
            <div>Sun</div><div>Mon</div><div>Tue</div>
            <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <div class="calendar-dates" id="calendarDates"></div>
    </div>
</div>

<footer>
    Task Reminder App © 2025 — Created by Bishwanath Kumam
</footer>

<!-- ================= SCRIPTS ================= -->
<script th:inline="javascript">
    const monthYear = document.getElementById("monthYear");
    const calendarDates = document.getElementById("calendarDates");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const themeIcon = document.getElementById("themeIcon");

    let currentDate = new Date();
    let tasks = /*[[${tasks}]]*/ [];

    function renderCalendar() {
        calendarDates.innerHTML = "";
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        monthYear.innerText = currentDate.toLocaleString("default", {
            month: "long",
            year: "numeric"
        });

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            calendarDates.appendChild(document.createElement("div"));
        }

        for (let day = 1; day <= lastDate; day++) {
            const dateDiv = document.createElement("div");
            dateDiv.className = "date";

            const dateNumber = document.createElement("div");
            dateNumber.className = "date-number";
            dateNumber.innerText = day;
            dateDiv.appendChild(dateNumber);

            const fullDate = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

            tasks.filter(t => t.dueDate === fullDate).forEach(task => {
                const taskDiv = document.createElement("div");
                taskDiv.className = `task priority-${task.priority}`;
                taskDiv.innerText = task.title;
                dateDiv.appendChild(taskDiv);
            });

            calendarDates.appendChild(dateDiv);
        }
    }

    // CLOCK
    setInterval(() => {
        document.getElementById("clock").innerText =
            "🕒 " + new Date().toLocaleTimeString();
    }, 1000);

    // DARK MODE
    function applyTheme(theme) {
        document.body.classList.toggle("dark-mode", theme === "dark");
        themeIcon.className =
            theme === "dark"
                ? "fa-solid fa-sun theme-toggle"
                : "fa-solid fa-moon theme-toggle";
    }

    const savedTheme = localStorage.getItem("theme") || "light";
    applyTheme(savedTheme);

    themeIcon.onclick = () => {
        const newTheme = document.body.classList.contains("dark-mode") ? "light" : "dark";
        localStorage.setItem("theme", newTheme);
        applyTheme(newTheme);
    };

    prevBtn.onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
    nextBtn.onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };

    renderCalendar();
</script>

</body>
</html>
